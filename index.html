<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Purple Background */
    .bg-purple {
      background-color: #7a45de; /* Purple color */
    }

    /* Purple Text */
    .text-purple {
      color: #7a45de; /* Same purple as the background */
    }

    /* Make carousel caption background smaller */
    .carousel-caption {
      background-color: #7a45de; /* Purple background */
      display: inline-block; /* Shrink background to fit text */
      padding: 5px 10px; /* Add padding around the text */
      border-radius: 5px; /* Rounded corners */
      opacity: 0.9; /* Slight transparency */
    }

    /* Style the carousel control buttons */
    .custom-carousel-control .carousel-control-prev-icon,
    .custom-carousel-control .carousel-control-next-icon {
      background-color: #7a45de; /* Purple background for buttons */
      border-radius: 50%; /* Make the buttons circular */
      width: 40px;
      height: 40px;
    }

    .custom-carousel-control:hover .carousel-control-prev-icon,
    .custom-carousel-control:hover .carousel-control-next-icon {
      background-color: #5e34b1; /* Darker purple on hover */
    }
  </style>
</head>
<body>
<!-- Navigation Bar -->
<nav class="navbar bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="index.html">My Portfolio</a>
    <ul class="navbar-nav d-flex flex-row">
      <li class="nav-item me-3">
        <a class="nav-link active text-white" aria-current="page" href="index.html">Home</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link text-white" href="about.html">About</a>
      </li>
      <li class="nav-item me-3">
        <a class="nav-link text-white" href="projects.html">Projects</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="contact.html">Contact</a>
      </li>
    </ul>
  </div>
</nav>

  <!-- Header -->
  <section class="bg-purple text-white py-5">
    <div class="container text-center py-4">
      <h1 class="display-4 fw-bold">Hi, I'm <span class="text-warning">Andrew Kolocotronis</span></h1>
      <p class="lead mt-3">An Information Systems graduate passionate about problem-solving and technology.</a></p>
      <div class="mt-4">
        <a href="projects.html" class="btn btn-warning btn-lg me-2">View My Projects</a>
        <a href="contact.html" class="btn btn-outline-light btn-lg">Contact Me</a>
      </div>
    </div>
  </section>

  <!-- Image Carousel Section -->
  <section class="bg-light py-5">
    <div class="container">
      <h2 class="text-center fw-bold mb-4">Highlights</h2>
      <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="images/data-chart.jpg" class="d-block w-100" alt="Data Chart">
            <div class="carousel-caption d-none d-md-block">
              <h5>Data Chart</h5>
              <p>Sample Data Chart</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="images/sample-dataset.jpg" class="d-block w-100" alt="Dataset">
            <div class="carousel-caption d-none d-md-block">
              <h5>Dataset</h5>
              <p>Sample Dataset</p>
            </div>
          </div>
          <div class="carousel-item">
            <img src="images/Restaurant-database.jpg" class="d-block w-100" alt="Database">
            <div class="carousel-caption d-none d-md-block">
              <h5>Database</h5>
              <p>Working/Live Database</p>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev custom-carousel-control" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next custom-carousel-control" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
